<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <!-- Primary Meta Tags -->
    <title>Moihub - Everything You Need at Moi University</title>
    <meta name="description" content="Find rentals, order food, shop, and more — all in one place. Explore Moihub today!" />
    <meta name="theme-color" content="#093028" />
    
    <!-- Favicon Tags -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="icon" href="/favicon.ico" />
    
    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:title" content="Moihub - Everything You Need at Moi University" />
    <meta property="og:description" content="Find rentals, order food, shop, and more — all in one place. Explore Moihub today!" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://moihub-silk.vercel.app/" />

    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Moihub - Everything You Need at Moi University" />
    <meta name="twitter:description" content="Find rentals, order food, shop, and more — all in one place." />
    <meta name="twitter:image" content="https://res.cloudinary.com/dlyfxympd/image/upload/v1785327648/og-image_syx7u9.png" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  </head>
  <body>
    <!-- ResizeObserver Error Handler -->
    <script>
      window.addEventListener('error', (e) => {
        if (e.message && e.message.includes('ResizeObserver loop')) {
          e.stopImmediatePropagation();
        }
      }, true);
    </script>
    
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
