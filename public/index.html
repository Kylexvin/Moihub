<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <!-- Remove title and description from here -->
    <!-- They will be set by Helmet on each page -->
    
    <meta name="theme-color" content="#093028" />
    <meta name="robots" content="index, follow" />
    
    <!-- Favicon Tags -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="icon" href="/favicon.ico" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://moihub-silk.vercel.app/" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Moihub",
      "description": "Everything You Need at Moi University",
      "url": "https://moihub-silk.vercel.app/",
      "logo": "https://moihub-silk.vercel.app/apple-touch-icon.png"
    }
    </script>
  </head>
  <body>
    <script>
      window.addEventListener('error', (e) => {
        if (e.message && e.message.includes('ResizeObserver loop')) {
          e.stopImmediatePropagation();
        }
      }, true);
    </script>
    
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
